name: Phar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pack:
    name: Pack in-process, then build the demo and boot it
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov

      - name: Install
        run: composer update --no-interaction --no-progress

      # phar.readonly is INI_SYSTEM: only a process started with -d phar.readonly=0 can
      # write an archive, and only one started with =1 reaches the guard that says so.
      - name: Test the packing a read-only ini has to skip
        run: php -d phar.readonly=0 -d pcov.enabled=1 vendor/bin/phpunit --coverage-php=/tmp/cov-writable.php

      - name: Test the guard a writable ini has to skip
        run: php -d phar.readonly=1 -d pcov.enabled=1 vendor/bin/phpunit --coverage-php=/tmp/cov-readonly.php --filter testPackingNeedsAWritablePharIni

      # One report, not two: the service keeps the last upload for each file, so two clover
      # files would let the second run's misses erase the first run's hits.
      - name: Merge both inis into one report
        run: php script/merge-coverage.php coverage.xml /tmp/cov-writable.php /tmp/cov-readonly.php

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Install the demo against this checkout
        working-directory: demo
        run: |
          composer config repositories.package '{"type":"path","url":"..","options":{"symlink":false}}'
          composer require 'bear/package:*@dev' -W --no-interaction

      - name: Compile and pack
        working-directory: demo
        run: APP_WRITE_DIR=/tmp/bear php bin/compile.php

      - name: Boot the archive with the build tree deleted
        run: |
          mv demo/var/build/prod-cli-hal-app.phar /tmp/app.phar
          rm -rf demo src vendor
          rm -rf /tmp/bear
          CONTEXT=prod-cli-hal-app APP_WRITE_DIR=/tmp/bear php /tmp/app.phar get /index | tee /tmp/response
          grep -q '200 OK' /tmp/response
