name: Phar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pack:
    name: Pack in-process, then build the demo and boot it
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov

      - name: Install
        run: composer update --no-interaction --no-progress

      # Only a process started with phar.readonly=0 packs an archive.
      - name: Test with a writable phar ini
        run: php -d phar.readonly=0 -d pcov.enabled=1 vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Check that every statement ran
        run: php script/coverage-gate.php coverage.xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Install the demo against this checkout
        working-directory: demo
        run: |
          composer config repositories.package '{"type":"path","url":"..","options":{"symlink":false}}'
          # Stability flags only count from the root: drop this once bear/sunday 1.9.0 is tagged.
          composer config minimum-stability dev
          composer config prefer-stable true
          composer require 'bear/package:*@dev' -W --no-interaction

      - name: Run the demo tests
        run: vendor/bin/phpunit --no-coverage -c demo/phpunit.xml.dist

      - name: Compile and pack
        working-directory: demo
        run: php bin/compile.php

      - name: Check the archive carries the application's own files under var/
        run: |
          php -r '
          $phar = new Phar("demo/app.phar");
          if (! isset($phar["var/foo.txt"])) {
              fwrite(STDERR, "the archive dropped var/foo.txt\n");
              exit(1);
          }
          if (isset($phar["app.phar"])) {
              fwrite(STDERR, "the archive packed itself\n");
              exit(1);
          }
          foreach (new RecursiveIteratorIterator($phar) as $file) {
              if (str_contains(str_replace("\\", "/", $file->getPathname()), "/var/log/")) {
                  fwrite(STDERR, "the archive carries var/log\n");
                  exit(1);
              }
          }'

      - name: Boot the archive with the build tree deleted
        run: |
          mv demo/app.phar /tmp/app.phar
          rm -rf demo src vendor
          CONTEXT=prod-cli-hal-app php /tmp/app.phar get /index | tee /tmp/response
          grep -q '200 OK' /tmp/response

      # The archive holds no write directory, so the machine that boots answers it.
      - name: Boot the same archive under another temp directory
        run: |
          CONTEXT=prod-cli-hal-app TMPDIR=/tmp/elsewhere php /tmp/app.phar get /index | tee /tmp/elsewhere
          grep -q '200 OK' /tmp/elsewhere
