name: Phar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pack:
    name: Pack in-process, then build the demo and boot it
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov

      - name: Install
        run: composer update --no-interaction --no-progress

      # The suite covers the same lines under any phar.readonly, but only a process started
      # with =0 packs an archive, so run it that way here and prove nothing was left unrun.
      - name: Test with a writable phar ini
        run: php -d phar.readonly=0 -d pcov.enabled=1 vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Check that every statement ran
        run: php script/coverage-gate.php coverage.xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Install the demo against this checkout
        working-directory: demo
        run: |
          composer config repositories.package '{"type":"path","url":"..","options":{"symlink":false}}'
          composer require 'bear/package:*@dev' -W --no-interaction

      - name: Compile and pack
        working-directory: demo
        run: APP_WRITE_DIR=/tmp/bear php bin/compile.php

      - name: Boot the archive with the build tree deleted
        run: |
          mv demo/var/build/prod-cli-hal-app.phar /tmp/app.phar
          rm -rf demo src vendor
          rm -rf /tmp/bear
          CONTEXT=prod-cli-hal-app APP_WRITE_DIR=/tmp/bear php /tmp/app.phar get /index | tee /tmp/response
          grep -q '200 OK' /tmp/response
