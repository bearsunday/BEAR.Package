# Alerts only major updates for Packagist (Composer)
#
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "composer" # Specify the correct package ecosystem for PHP
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*" # Ignore all dependencies for specific update types
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "phpunit/phpunit"
        versions: ["*"]
  - package-ecosystem: "composer"
    directory: "/demo"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
  - package-ecosystem: "composer"
    directory: "/tests/Fake/fake-app"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
  - package-ecosystem: "composer"
    directory: "/vendor-bin/tools"
    schedule:
      interval: "monthly"
    # Dev tools are pinned by hand: no minor/patch noise, no major bumps, and
    # no security-update PRs either (`ignore` applies to security updates too).
    ignore:
      - dependency-name: "*"
